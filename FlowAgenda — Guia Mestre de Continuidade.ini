FlowAgenda — Guia Mestre de Continuidade, Arquitetura e EngenhariaVersão: 5.0 (Definitiva — MVP Completo e Homologado em Produção)Ambiente Oficial: [https://flowagenda.online](https://flowagenda.online)Deploy & Edge Network: VercelDNS & Registradora: Hostinger (*.flowagenda.online com SSL Wildcard)   Estado da Base: TypeScript Estrito (tsc --noEmit exit 0), 14+ rotas compiladas no Next.js 16 App RouterData de Consolidação: Outubro de 2026Comando para Iniciar a Nova ConversaPara continuar os trabalhos sem perda de estado, inicie o próximo chat anexando este documento com a seguinte instrução:"Leia este documento de continuidade do FlowAgenda (v5.0) e atue como Arquiteto de Software e Engenheiro Líder do projeto. O MVP transacional está concluído e homologado. Vamos iniciar o plano de testes práticos em produção e o onboarding do primeiro lojista real."1. Resumo Executivo da Stack e Infraestrutura HomologadaFramework Web: Next.js 16 (App Router), React 19, TypeScript estrito.   Design System: Tailwind CSS v4 com paleta Nord Dark (#242933, #2E3440, #3B4252, #88C0D0, #A3BE8C, #BF616A, #ECEFF4).   Banco de Dados & Auth: Supabase PostgreSQL com Row Level Security (RLS) habilitado em todas as tabelas.   Mensageria WhatsApp: Evolution API v2 hospedada em VPS dedicada (179.236.70.181:8080), com emulação de presença (composing), jitter aleatório (3 a 7 segundos) e healthcheck automatizado via Cron.   Gateway Financeiro: Asaas API v3 com subcontas transparentes, webhooks idempotentes, tolerância de +3 min para compensação Pix e estorno automático em caso de colisão de slot expirado.   Inteligência Artificial & CRM: SDK oficial @google/genai com gemini-1.5-flash para transcrição e estruturação anônima/efêmera de áudio (LGPD-compliant), com fallback local on-device via Web Speech API.   2. Mapa dos Módulos Críticos Implementadosflowagenda/
