3. Regras de Negócio e Blindagens ConsolidadasMulti-Tenancy Wildcard:flowagenda.online / www ➔ Landing Page Comercial (/).   app.flowagenda.online ➔ Painel Administrativo do Lojista (/app/dashboard).   {slug}.flowagenda.online ➔ Grade pública de agendamento do lojista (/loja/[slug]).   Slugs reservados protegidos tanto no middleware quanto via constraint de check no Supabase.   Buffer Time (Intervalo entre Atendimentos):O cálculo de ocupação no PostgreSQL considera obrigatoriamente data_horario + (duracao_minutos + intervalo_minutos).   Checkout Híbrido e Trava de Concorrência:Sem Sinal: Lock provisório de 10 minutos com validação por PIN de 6 dígitos via WhatsApp.   Com Sinal Pix: Cobrança Asaas com 13 minutos de tolerância (10 min de preenchimento + 3 min bancários). Em caso de pagamento após concorrência, o sistema executa estorno automático (/v3/payments/{id}/refund) e alerta o cliente.   Ciclo de Vida Automatizado (Vercel Cron):A cada 10 min: Dispara lembretes 2 horas antes do procedimento com link de cancelamento/remarcação.   A cada 10 min: Localiza atendimentos concluídos há 2 horas e solicita nota 1 a 5 estrelas direcionando para o link do Google Meu Negócio do lojista.   A cada 15 min: Varre o estado de conexão das instâncias na VPS Evolution API, alertando o lojista por e-mail em caso de desconexão.   Privacidade e LGPD no Voice CRM:Nenhum dado de identificação do cliente trafega para a API do Gemini.   Buffer de áudio destruído da memória RAM imediatamente após a transcrição.   Modo alternativo 100% On-Device operando via Web Speech API nativa no dispositivo do profissional para dados sob sigilo clínico rigoroso.   4. Próximos Passos Recomendados para a Nova ConversaDeploy e Redeploy na Vercel:Confirmar a injeção das variáveis de ambiente (GEMINI_API_KEY, EVOLUTION_API_URL, EVOLUTION_API_KEY, CRON_SECRET, ASAAS_API_KEY, ASAAS_WEBHOOK_SECRET) e disparar o build de produção.Teste Real E2E em Produção:Acessar um subdomínio de teste (ex: barbeariamodelo.flowagenda.online), agendar um horário com número real de WhatsApp e testar o recebimento do PIN e a gravação de uma nota de voz no dashboard.   Onboarding Comercial:Cadastrar o primeiro lojista real na plataforma com catálogo de serviços e horários de funcionamento.Copie este compilado, salve como guia_mestre_v5.md e inicie uma nova conversa para mantermos o projeto no mais alto nível de performance e acuidade técnica.